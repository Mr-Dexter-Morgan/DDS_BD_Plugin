name: Finalize DDS 0.5.3 docs

on:
  push:
    branches:
      - feature/plugin-heartbeat-0.5.3
    paths:
      - '.github/workflows/finalize-0.5.3-docs.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/plugin-heartbeat-0.5.3
          fetch-depth: 0

      - name: Promote release documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact('CHANGELOG.md', '## [0.5.3] — candidate', '## [0.5.3] — 2026-09-16')
          replace_exact('CHANGELOG.md', '**Status: CANDIDATE / AWAITING LIVE VALIDATION**', '**Status: VERIFIED / LIVE TESTED**')
          replace_exact(
              'CHANGELOG.md',
              '**Release discipline:** 0.5.2 remains the recommended stable plugin. 0.5.3 must be live-tested in BetterDiscord together with DDS Companion 0.4.4 before this candidate may be merged/promoted and published as a GitHub Release.',
              '**Live validation:** BetterDiscord + DDS Companion 0.4.4 confirmed RUNNING heartbeat, periodic refresh, clean STOPPED on disable, Companion `RUNNING → LIMITED`, and automatic `LIMITED → RUNNING` recovery after re-enable without restarting Companion. User marked the build LIVE TESTED / APPROVED.'
          )

          replace_exact(
              'RELEASES.md',
              '| `0.5.2` | 2026-09-13 | **VERIFIED / STABLE MILESTONE** | BetterDiscord-compatible Disk Export live verified on Windows; current recommended plugin release. |',
              '| `0.5.2` | 2026-09-13 | **VERIFIED / STABLE MILESTONE** | BetterDiscord-compatible Disk Export live verified on Windows. |'
          )
          replace_exact(
              'RELEASES.md',
              '| `0.5.3` | pending live test | **CANDIDATE / AWAITING LIVE VALIDATION** | Adds `plugin-heartbeat-v1` for truthful Companion health: immediate/periodic RUNNING heartbeat and clean STOPPED marker. Capture semantics unchanged. |',
              '| `0.5.3` | 2026-09-16 | **VERIFIED / LIVE TESTED** | `plugin-heartbeat-v1` live verified with Companion 0.4.4: RUNNING, periodic refresh, STOPPED, LIMITED, and automatic recovery. Capture semantics unchanged. |'
          )
          replace_exact(
              'RELEASES.md',
              '**`0.5.2`**\n\nUse this version for normal development and live testing until 0.5.3 explicitly earns VERIFIED status.',
              '**`0.5.3`**\n\nPromoted on 2026-09-16 after live BetterDiscord + DDS Companion 0.4.4 validation.'
          )
          old_candidate = '''## Current candidate

**`0.5.3` — Plugin Heartbeat v1**

Candidate rules:

1. Keep 0.5.2 as stable/recommended during testing.
2. Test 0.5.3 in real BetterDiscord together with DDS Companion 0.4.4.
3. Verify enable -> RUNNING heartbeat, disable -> STOPPED, re-enable -> recovery.
4. Verify ordinary Structured Capture / Disk Export still works.
5. Only after live validation: merge/promote and create a GitHub Release.'''
          new_validation = '''## 0.5.3 validation summary

- Live-tested with BetterDiscord and DDS Companion 0.4.4.
- Companion detected Plugin 0.5.3 as RUNNING with active heartbeat.
- Heartbeat timestamp advanced while enabled.
- Disabling DDS wrote STOPPED and changed Companion Health to LIMITED / NOT RUNNING.
- Re-enabling DDS restored RUNNING automatically without a Companion restart.
- Validated artifact SHA-256: `59184c7dfed3644acd9cfcc0f1c228eb491d60474e877366eed70cd42f6582af`.
- User approval: **LIVE TESTED / APPROVED**.'''
          replace_exact('RELEASES.md', old_candidate, new_validation)

          replace_exact('README.md', 'version-0.5.2-7b7cff', 'version-0.5.3-7b7cff')
          replace_exact('README.md', '**v0.5.2 — Disk Export / BetterDiscord filesystem compatibility**', '**v0.5.3 — Plugin Heartbeat / truthful Companion health**')
          replace_exact(
              'README.md',
              'This is the current recommended plugin release. It has been live-validated on Windows with Discord Desktop + BetterDiscord.',
              'This is the current recommended plugin release. It has been live-validated on Windows with Discord Desktop + BetterDiscord and DDS Companion 0.4.4.'
          )
          replace_exact(
              'README.md',
              "- graceful compatibility with BetterDiscord's reduced filesystem API.",
              "- graceful compatibility with BetterDiscord's reduced filesystem API;\n- local `plugin-heartbeat-v1` status for DDS Companion Health, including clean STOPPED state and automatic recovery."
          )
          replace_exact(
              'README.md',
              '| `0.5.2` | VERIFIED / STABLE MILESTONE | BetterDiscord-compatible Disk Export |',
              '| `0.5.2` | VERIFIED / STABLE MILESTONE | BetterDiscord-compatible Disk Export |\n| `0.5.3` | VERIFIED / LIVE TESTED | Plugin Heartbeat / Companion Health contract |'
          )
          PY

      - name: Verify source and docs
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@version 0.5.3' DDS.plugin.js
          grep -q 'VERIFIED / LIVE TESTED' CHANGELOG.md
          grep -q '\*\*`0.5.3`\*\*' RELEASES.md
          grep -q 'version-0.5.3-7b7cff' README.md
          node --check DDS.plugin.js
          test "$(sha256sum DDS.plugin.js | awk '{print $1}')" = "59184c7dfed3644acd9cfcc0f1c228eb491d60474e877366eed70cd42f6582af"

      - name: Commit promoted documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md RELEASES.md README.md
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git commit -m 'docs: promote DDS Plugin 0.5.3 after live validation'
          git push origin HEAD:feature/plugin-heartbeat-0.5.3
