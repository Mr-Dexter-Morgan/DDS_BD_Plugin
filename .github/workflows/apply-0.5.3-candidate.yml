name: Apply DDS 0.5.3 candidate

on:
  push:
    branches:
      - feature/plugin-heartbeat-0.5.3
    paths:
      - '.github/workflows/apply-0.5.3-candidate.yml'
      - 'docs/candidates/0.5.3.patch'

permissions:
  contents: write

jobs:
  apply-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/plugin-heartbeat-0.5.3
          fetch-depth: 0

      - name: Apply validated 0.5.3 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '@version 0.5.3' DDS.plugin.js; then
            echo 'DDS.plugin.js is already 0.5.3; nothing to apply.'
            exit 0
          fi
          sed 's/^--- DDS\.plugin\.0\.5\.2\.js$/--- DDS.plugin.js/' docs/candidates/0.5.3.patch > /tmp/dds-0.5.3.patch
          git apply --check /tmp/dds-0.5.3.patch
          git apply /tmp/dds-0.5.3.patch
          node --check DDS.plugin.js

      - name: Commit candidate source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- DDS.plugin.js; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DDS.plugin.js
          git commit -m 'feat: apply live-tested DDS plugin heartbeat 0.5.3'
          git push origin HEAD:feature/plugin-heartbeat-0.5.3
