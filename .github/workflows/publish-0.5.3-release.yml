name: Publish DDS Plugin 0.5.3 release

on:
  push:
    branches:
      - feature/plugin-heartbeat-0.5.3
    paths:
      - '.github/workflows/publish-0.5.3-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify validated artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@version 0.5.3' DDS.plugin.js
          node --check DDS.plugin.js
          ACTUAL="$(sha256sum DDS.plugin.js | awk '{print $1}')"
          EXPECTED='59184c7dfed3644acd9cfcc0f1c228eb491d60474e877366eed70cd42f6582af'
          test "$ACTUAL" = "$EXPECTED"
          printf '%s  %s\n' "$ACTUAL" 'DDS.plugin.js' > DDS.plugin.js.sha256

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.5.3 already exists; nothing to publish.'
            exit 0
          fi
          gh release create v0.5.3 \
            DDS.plugin.js \
            DDS.plugin.js.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'DDS Plugin 0.5.3 — Plugin Heartbeat' \
            --notes-file docs/RELEASE_NOTES_0.5.3.md \
            --latest
